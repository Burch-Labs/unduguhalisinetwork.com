<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lilita Keper - Agent Portal Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #D4AF37;
            --dark-green: #1B4D3E;
            --cream: #F5F1E8;
            --dark-brown: #3D2817;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1B4D3E 0%, #3D2817 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .login-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            max-width: 450px;
            width: 100%;
        }

        .login-header {
            background: linear-gradient(135deg, #1B4D3E 0%, #2D6A58 100%);
            color: white;
            padding: 2.5rem 2rem;
            text-align: center;
        }

        .logo-large {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }

        .login-header h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .login-header p {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .login-form {
            padding: 2.5rem 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #1B4D3E;
            font-weight: 600;
            font-size: 0.95rem;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 0.9rem;
            border: 2px solid #E0E0E0;
            border-radius: 6px;
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.3s;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #D4AF37;
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
        }

        .remember-me {
            display: flex;
            align-items: center;
            margin-bottom: 1.5rem;
            color: #666;
            font-size: 0.9rem;
        }

        .remember-me input {
            margin-right: 0.5rem;
            cursor: pointer;
        }

        .btn-login {
            width: 100%;
            padding: 0.95rem;
            background: linear-gradient(135deg, #D4AF37 0%, #C19A6B 100%);
            color: #1B4D3E;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.3);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .forgot-password {
            text-align: center;
            margin-top: 1rem;
        }

        .forgot-password a {
            color: #D4AF37;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        .demo-credentials {
            background: #F5F1E8;
            border-left: 4px solid #D4AF37;
            padding: 1rem;
            margin-top: 1.5rem;
            border-radius: 4px;
            font-size: 0.9rem;
            color: #333;
        }

        .demo-credentials strong {
            color: #1B4D3E;
            display: block;
            margin-bottom: 0.5rem;
        }

        .demo-credentials code {
            background: white;
            padding: 0.25rem 0.5rem;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
        }

        .error-message {
            background: #FFE5E5;
            border: 1px solid #FF6B6B;
            color: #C92A2A;
            padding: 0.75rem;
            border-radius: 4px;
            margin-bottom: 1rem;
            display: none;
        }

        .success-message {
            background: #E5F8F0;
            border: 1px solid #00D084;
            color: #1B5E20;
            padding: 0.75rem;
            border-radius: 4px;
            margin-bottom: 1rem;
            display: none;
        }

        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 0.5rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn-login.loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        @media (max-width: 480px) {
            .login-container {
                margin: 1rem;
            }

            .login-header {
                padding: 2rem 1.5rem;
            }

            .login-form {
                padding: 2rem 1.5rem;
            }

            .login-header h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="logo-large">🦁</div>
            <h1>LILITA KEPER</h1>
            <p>Agent Portal</p>
        </div>

        <div class="login-form">
            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>

            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="agent@example.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="••••••••"
                        required
                    >
                </div>

                <div class="remember-me">
                    <input type="checkbox" id="rememberMe">
                    <label for="rememberMe" style="margin: 0;">Remember me</label>
                </div>

                <button type="submit" class="btn-login" id="loginBtn">
                    <span class="spinner" id="spinner"></span>
                    Sign In
                </button>

                <div class="forgot-password">
                    <a href="#" onclick="handleForgotPassword(event)">Forgot your password?</a>
                </div>
            </form>

            <div class="demo-credentials">
                <strong>🧪 Demo Credentials:</strong>
                Email: <code>agent@lilitakeper.com</code><br>
                Password: <code>demo123</code><br>
                <small style="margin-top: 0.5rem; display: block;">or <a href="/agent-dashboard.html" style="color: #D4AF37;">view dashboard directly</a></small>
            </div>
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            const loginBtn = document.getElementById('loginBtn');
            const spinner = document.getElementById('spinner');
            const errorMsg = document.getElementById('errorMessage');
            const successMsg = document.getElementById('successMessage');

            // Show loading state
            spinner.style.display = 'inline-block';
            loginBtn.disabled = true;

            // Simulate API call
            setTimeout(() => {
                // Demo authentication
                if (email === 'agent@lilitakeper.com' && password === 'demo123') {
                    // Store credentials if remember me is checked
                    if (rememberMe) {
                        localStorage.setItem('agentEmail', email);
                    }

                    // Show success message
                    successMsg.textContent = '✓ Login successful! Redirecting...';
                    successMsg.style.display = 'block';
                    errorMsg.style.display = 'none';

                    // Redirect to dashboard
                    setTimeout(() => {
                        window.location.href = '/agent-dashboard.html';
                    }, 1500);
                } else {
                    errorMsg.textContent = '✗ Invalid email or password. Please try again.';
                    errorMsg.style.display = 'block';
                    successMsg.style.display = 'none';

                    spinner.style.display = 'none';
                    loginBtn.disabled = false;
                }
            }, 1500);
        }

        function handleForgotPassword(event) {
            event.preventDefault();
            alert('Please contact: sales@lilitakeper.com to reset your password.');
        }

        // Load remember me email if exists
        window.addEventListener('load', () => {
            const savedEmail = localStorage.getItem('agentEmail');
            if (savedEmail) {
                document.getElementById('email').value = savedEmail;
                document.getElementById('rememberMe').checked = true;
            }
        });
    </script>
</body>
</html>
