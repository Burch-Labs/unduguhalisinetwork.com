steps:
  # Step 1: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/lilita-keper-portal:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/lilita-keper-portal:latest'
      - '.'

  # Step 2: Push image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/lilita-keper-portal:$SHORT_SHA'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gke-deploy'
    args:
      - run
      - '--filename=.'
      - '--image=gcr.io/$PROJECT_ID/lilita-keper-portal:$SHORT_SHA'
      - '--location=us-central1'
      - '--output=/var/run/output'

images:
  - 'gcr.io/$PROJECT_ID/lilita-keper-portal:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/lilita-keper-portal:latest'

options:
  machineType: 'N1_HIGHCPU_8'

timeout: '1800s'

substitutions:
  _SERVICE_NAME: 'lilita-keper-portal'
  _REGION: 'us-central1'
