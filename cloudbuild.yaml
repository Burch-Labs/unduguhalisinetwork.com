steps:
  # Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/burch-platform:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/burch-platform:latest'
      - '.'

  # Push image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/burch-platform:$SHORT_SHA'

  # Run database migrations if needed
  - name: 'gcr.io/cloud-builders/gke-deploy'
    id: 'setup-db'
    args:
      - 'run'
      - 'gcr.io/$PROJECT_ID/burch-platform:$SHORT_SHA'
      - '--'
      - 'npx'
      - 'prisma'
      - 'migrate'
      - 'deploy'
    env:
      - 'DATABASE_URL=${_DATABASE_URL}'
    allowFailure: true

  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/run'
    id: 'deploy-cloud-run'
    args:
      - 'deploy'
      - 'burch-platform'
      - '--image'
      - 'gcr.io/$PROJECT_ID/burch-platform:$SHORT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'NODE_ENV=production,DATABASE_URL=${_DATABASE_URL},NEXTAUTH_SECRET=${_NEXTAUTH_SECRET},NEXTAUTH_URL=${_NEXTAUTH_URL},RESEND_API_KEY=${_RESEND_API_KEY},ANTHROPIC_API_KEY=${_ANTHROPIC_API_KEY}'

images:
  - 'gcr.io/$PROJECT_ID/burch-platform:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/burch-platform:latest'

options:
  machineType: 'N1_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

timeout: '3600s'

substitutions:
  _DATABASE_URL: ''
  _NEXTAUTH_SECRET: ''
  _NEXTAUTH_URL: ''
  _RESEND_API_KEY: ''
  _ANTHROPIC_API_KEY: ''
